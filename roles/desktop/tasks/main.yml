---
# =============================================================================
# WAYLAND COMPOSITORS
# =============================================================================
- name: Install Hyprland and core Wayland tools
  when: selected_wm == "hyprland"
  become: true
  community.general.pacman:
    name:
      - hyprland
      - xdg-desktop-portal-hyprland
      - xorg-xwayland
      - qt5-wayland
      - qt6-wayland
    state: present

- name: Install Sway and xdg-desktop-portal
  when: selected_wm == "sway"
  become: true
  community.general.pacman:
    name:
      - sway
      - xdg-desktop-portal
      - xdg-desktop-portal-wlr
      - xorg-xwayland
    state: present

- name: Install Niri compositor
  when: selected_wm == "niri"
  become: true
  community.general.pacman:
    name:
      - niri
      - xdg-desktop-portal-gnome
      - xorg-xwayland
    state: present

- name: Install River compositor
  when: selected_wm == "river"
  become: true
  community.general.pacman:
    name:
      - river
      - xdg-desktop-portal-wlr
      - xorg-xwayland
    state: present

# =============================================================================
# X11 WINDOW MANAGERS
# =============================================================================
- name: Install i3-wm ecosystem
  when: selected_wm == "i3"
  become: true
  community.general.pacman:
    name:
      - i3-wm
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

- name: Install bspwm ecosystem
  when: selected_wm == "bspwm"
  become: true
  community.general.pacman:
    name:
      - bspwm
      - sxhkd
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

- name: Install AwesomeWM ecosystem
  when: selected_wm == "awesome"
  become: true
  community.general.pacman:
    name:
      - awesome
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

- name: Install Qtile ecosystem
  when: selected_wm == "qtile"
  become: true
  community.general.pacman:
    name:
      - qtile
      - python-psutil
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

- name: Install Openbox ecosystem
  when: selected_wm == "openbox"
  become: true
  community.general.pacman:
    name:
      - openbox
      - obconf
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

# =============================================================================
# DEPLOY WINDOW MANAGER CONFIGURATION TEMPLATES
# =============================================================================
- name: Ensure target configuration directories exist
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - hypr
    - sway
    - i3
    - bspwm
    - sxhkd
    - niri
    - river
    - awesome
    - qtile
    - openbox

- name: Deploy Hyprland config
  when: selected_wm == "hyprland"
  ansible.builtin.template:
    src: hyprland.conf.j2
    dest: "{{ ansible_env.HOME }}/.config/hypr/hyprland.conf"
    mode: '0644'

- name: Deploy Sway config
  when: selected_wm == "sway"
  ansible.builtin.template:
    src: sway.config.j2
    dest: "{{ ansible_env.HOME }}/.config/sway/config"
    mode: '0644'

- name: Deploy i3 config
  when: selected_wm == "i3"
  ansible.builtin.template:
    src: i3.config.j2
    dest: "{{ ansible_env.HOME }}/.config/i3/config"
    mode: '0644'

- name: Deploy bspwm config
  when: selected_wm == "bspwm"
  ansible.builtin.template:
    src: bspwm.config.j2
    dest: "{{ ansible_env.HOME }}/.config/bspwm/bspwmrc"
    mode: '0755'

- name: Deploy sxhkd config
  when: selected_wm == "bspwm"
  ansible.builtin.template:
    src: sxhkd.config.j2
    dest: "{{ ansible_env.HOME }}/.config/sxhkd/sxhkdrc"
    mode: '0644'

- name: Deploy Niri config
  when: selected_wm == "niri"
  ansible.builtin.template:
    src: niri.config.kdl.j2
    dest: "{{ ansible_env.HOME }}/.config/niri/config.kdl"
    mode: '0644'

- name: Deploy River config
  when: selected_wm == "river"
  ansible.builtin.template:
    src: river.init.j2
    dest: "{{ ansible_env.HOME }}/.config/river/init"
    mode: '0755'

- name: Deploy AwesomeWM config
  when: selected_wm == "awesome"
  ansible.builtin.template:
    src: awesome.rc.lua.j2
    dest: "{{ ansible_env.HOME }}/.config/awesome/rc.lua"
    mode: '0644'

- name: Deploy Qtile config
  when: selected_wm == "qtile"
  ansible.builtin.template:
    src: qtile.config.py.j2
    dest: "{{ ansible_env.HOME }}/.config/qtile/config.py"
    mode: '0644'

- name: Deploy Openbox config
  when: selected_wm == "openbox"
  ansible.builtin.template:
    src: openbox.rc.xml.j2
    dest: "{{ ansible_env.HOME }}/.config/openbox/rc.xml"
    mode: '0644'
