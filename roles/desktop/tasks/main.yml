---
# =============================================================================
# PREREQUISITE: ENABLE MULTILIB REPOSITORY
# =============================================================================
- name: Enable [multilib] repository in pacman.conf
  become: true
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    block: |
      [multilib]
      Include = /etc/pacman.d/mirrorlist
  register: multilib_enabled

- name: Force pacman sync after enabling multilib
  when: multilib_enabled.changed
  become: true
  ansible.builtin.command:
    cmd: pacman -Sy
  changed_when: false

# =============================================================================
# 1. BASE GRAPHICS & MESA DRIVERS
# =============================================================================
- name: Install universal Mesa, Vulkan, and X11 graphics base packages
  become: true
  community.general.pacman:
    name:
      - mesa
      - lib32-mesa
      - vulkan-icd-loader
      - lib32-vulkan-icd-loader
      - xorg-xwayland
      - xf86-video-fbdev
    state: present

# =============================================================================
# INTEL GPU DRIVERS
# =============================================================================
- name: Install Intel GPU drivers and VA-API hardware acceleration
  when: ansible_facts['lspci_vendor_intel'] is defined or ('Intel' in (ansible_facts['cmdline'] | default('')))
  become: true
  community.general.pacman:
    name:
      - intel-media-driver
      - vulkan-intel
      - lib32-vulkan-intel
    state: present

# =============================================================================
# AMD GPU DRIVERS
# =============================================================================
- name: Install AMD GPU drivers and Vulkan support
  when: ansible_facts['lspci_vendor_amd'] is defined or ('AMD' in (ansible_facts['cmdline'] | default('')))
  become: true
  community.general.pacman:
    name:
      - xf86-video-amdgpu
      - vulkan-radeon
      - lib32-vulkan-radeon
      - libva-mesa-driver
    state: present

# =============================================================================
# NVIDIA GPU DRIVERS & WAYLAND MODESETTING
# =============================================================================
- name: Install NVIDIA proprietary drivers and utilities
  when: (gpu_vendor | default('')) == 'nvidia' or (selected_gpu | default('')) == 'nvidia'
  become: true
  community.general.pacman:
    name:
      - nvidia
      - nvidia-utils
      - lib32-nvidia-utils
      - nvidia-settings
      - egl-wayland
    state: present

- name: Enable NVIDIA DRM modesetting in modprobe (Critical for Wayland/Hyprland)
  when: (gpu_vendor | default('')) == 'nvidia' or (selected_gpu | default('')) == 'nvidia'
  become: true
  ansible.builtin.copy:
    dest: /etc/modprobe.d/nvidia.conf
    content: |
      options nvidia_drm modeset=1 fbdev=1
    mode: '0644'

- name: Add NVIDIA modules to initramfs for early KMS
  when: (gpu_vendor | default('')) == 'nvidia' or (selected_gpu | default('')) == 'nvidia'
  become: true
  ansible.builtin.lineinfile:
    path: /etc/mkinitcpio.conf
    regexp: '^MODULES=\((.*)\)'
    line: 'MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)'
  notify: Rebuild initramfs

# =============================================================================
# VIRTUAL MACHINE DRIVERS (QEMU / KVM / VirtualBox)
# =============================================================================
- name: Install QEMU/KVM guest agent and SPICE drivers
  when: (ansible_facts['virtualization_type'] | default('')) in ['kvm', 'qemu', 'bochs']
  become: true
  community.general.pacman:
    name:
      - qemu-guest-agent
      - spice-vdagent
      - xf86-video-qxl
    state: present

# =============================================================================
# 2. WAYLAND COMPOSITORS
# =============================================================================
- name: Install Hyprland and core Wayland tools
  when: selected_wm == "hyprland"
  become: true
  community.general.pacman:
    name:
      - hyprland
      - xdg-desktop-portal-hyprland
      - xorg-xwayland
      - qt5-wayland
      - qt6-wayland
    state: present

- name: Install Sway and xdg-desktop-portal
  when: selected_wm == "sway"
  become: true
  community.general.pacman:
    name:
      - sway
      - xdg-desktop-portal
      - xdg-desktop-portal-wlr
      - xorg-xwayland
    state: present

- name: Install Niri compositor
  when: selected_wm == "niri"
  become: true
  community.general.pacman:
    name:
      - niri
      - xdg-desktop-portal-gnome
      - xorg-xwayland
    state: present

- name: Install River compositor
  when: selected_wm == "river"
  become: true
  community.general.pacman:
    name:
      - river
      - xdg-desktop-portal-wlr
      - xorg-xwayland
    state: present

# =============================================================================
# 3. X11 WINDOW MANAGERS
# =============================================================================
- name: Install i3-wm ecosystem
  when: selected_wm == "i3"
  become: true
  community.general.pacman:
    name:
      - i3-wm
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

- name: Install bspwm ecosystem
  when: selected_wm == "bspwm"
  become: true
  community.general.pacman:
    name:
      - bspwm
      - sxhkd
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

- name: Install AwesomeWM ecosystem
  when: selected_wm == "awesome"
  become: true
  community.general.pacman:
    name:
      - awesome
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

- name: Install Qtile ecosystem
  when: selected_wm == "qtile"
  become: true
  community.general.pacman:
    name:
      - qtile
      - python-psutil
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

- name: Install Openbox ecosystem
  when: selected_wm == "openbox"
  become: true
  community.general.pacman:
    name:
      - openbox
      - obconf
      - xorg-server
      - xorg-xinit
      - picom
      - feh
    state: present

# =============================================================================
# 4. DEPLOY WINDOW MANAGER CONFIGURATION TEMPLATES
# =============================================================================
- name: Ensure target configuration directories exist
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - hypr
    - sway
    - i3
    - bspwm
    - sxhkd
    - niri
    - river
    - awesome
    - qtile
    - openbox

- name: Deploy Hyprland config
  when: selected_wm == "hyprland"
  ansible.builtin.template:
    src: hyprland.conf.j2
    dest: "{{ ansible_env.HOME }}/.config/hypr/hyprland.conf"
    mode: '0644'

- name: Deploy Sway config
  when: selected_wm == "sway"
  ansible.builtin.template:
    src: sway.config.j2
    dest: "{{ ansible_env.HOME }}/.config/sway/config"
    mode: '0644'

- name: Deploy i3 config
  when: selected_wm == "i3"
  ansible.builtin.template:
    src: i3.config.j2
    dest: "{{ ansible_env.HOME }}/.config/i3/config"
    mode: '0644'

- name: Deploy bspwm config
  when: selected_wm == "bspwm"
  ansible.builtin.template:
    src: bspwm.config.j2
    dest: "{{ ansible_env.HOME }}/.config/bspwm/bspwmrc"
    mode: '0755'

- name: Deploy sxhkd config
  when: selected_wm == "bspwm"
  ansible.builtin.template:
    src: sxhkd.config.j2
    dest: "{{ ansible_env.HOME }}/.config/sxhkd/sxhkdrc"
    mode: '0644'

- name: Deploy Niri config
  when: selected_wm == "niri"
  ansible.builtin.template:
    src: niri.config.kdl.j2
    dest: "{{ ansible_env.HOME }}/.config/niri/config.kdl"
    mode: '0644'

- name: Deploy River config
  when: selected_wm == "river"
  ansible.builtin.template:
    src: river.init.j2
    dest: "{{ ansible_env.HOME }}/.config/river/init"
    mode: '0755'

- name: Deploy AwesomeWM config
  when: selected_wm == "awesome"
  ansible.builtin.template:
    src: awesome.rc.lua.j2
    dest: "{{ ansible_env.HOME }}/.config/awesome/rc.lua"
    mode: '0644'

- name: Deploy Qtile config
  when: selected_wm == "qtile"
  ansible.builtin.template:
    src: qtile.config.py.j2
    dest: "{{ ansible_env.HOME }}/.config/qtile/config.py"
    mode: '0644'

- name: Deploy Openbox config
  when: selected_wm == "openbox"
  ansible.builtin.template:
    src: openbox.rc.xml.j2
    dest: "{{ ansible_env.HOME }}/.config/openbox/rc.xml"
    mode: '0644'

# =============================================================================
# 5. INSTALL & ENABLE DISPLAY MANAGER
# =============================================================================
- name: Set default display manager if not specified
  ansible.builtin.set_fact:
    selected_display_manager: "{{ selected_display_manager | default('sddm') }}"

- name: Install SDDM and dependencies
  when: selected_display_manager == 'sddm'
  become: true
  community.general.pacman:
    name:
      - sddm
      - qt6-svg
      - qt6-declarative
    state: present

- name: Install LightDM and GTK Greeter
  when: selected_display_manager == 'lightdm'
  become: true
  community.general.pacman:
    name:
      - lightdm
      - lightdm-gtk-greeter
    state: present

- name: Install GDM
  when: selected_display_manager == 'gdm'
  become: true
  community.general.pacman:
    name: gdm
    state: present

- name: Enable Display Manager systemd service
  become: true
  ansible.builtin.systemd:
    name: "{{ selected_display_manager }}"
    enabled: true
    state: started
  ignore_errors: true
