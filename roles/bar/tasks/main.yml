---
# =============================================================================
# INSTALLATION TASKS
# =============================================================================
- name: Install Waybar
  when: selected_bar == "waybar"
  become: true
  community.general.pacman:
    name:
      - waybar
      - otf-font-awesome
    state: present

- name: Install Polybar
  when: selected_bar == "polybar"
  become: true
  community.general.pacman:
    name:
      - polybar
      - ttf-font-awesome
    state: present

# AGS Installation
- name: Install AGS dependencies from official repos
  when: selected_bar == "ags"
  become: true
  community.general.pacman:
    name: gjs
    state: present

- name: Install AGS (Aylur's GTK Shell) via AUR
  when: selected_bar == "ags"
  become: false
  ansible.builtin.command:
    cmd: yay -S --noconfirm --needed aylurs-gtk-shell
  changed_when: false

# Eww Installation
- name: Install Eww dependencies from official repos
  when: selected_bar == "eww"
  become: true
  community.general.pacman:
    name: gtk3
    state: present

- name: Install Eww via AUR
  when: selected_bar == "eww"
  become: false
  ansible.builtin.command:
    cmd: yay -S --noconfirm --needed eww
  changed_when: false

# Quickshell Installation
- name: Install Quickshell
  when: selected_bar == "quickshell"
  become: true
  community.general.pacman:
    name: quickshell
    state: present

# Fabric Framework Installation
- name: Install Fabric framework official dependencies
  when: selected_bar == "fabric"
  become: true
  community.general.pacman:
    name:
      - gtk3
      - gtk4
      - python
    state: present

- name: Install Fabric framework via AUR
  when: selected_bar == "fabric"
  become: false
  ansible.builtin.command:
    cmd: yay -S --noconfirm --needed python-fabric-git
  changed_when: false

# =============================================================================
# CONFIGURATION TEMPLATE DEPLOYMENT
# =============================================================================
- name: Ensure bar configuration directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/{{ selected_bar }}"
    state: directory
    mode: '0755'
  when: selected_bar not in ["none", "fabric"]

- name: Ensure fabric configuration directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/fabric"
    state: directory
    mode: '0755'
  when: selected_bar == "fabric"

# Waybar Templates
- name: Deploy Waybar config (JSONC)
  when: selected_bar == "waybar"
  ansible.builtin.template:
    src: waybar.jsonc.j2
    dest: "{{ ansible_env.HOME }}/.config/waybar/config.jsonc"
    mode: '0644'

- name: Deploy Waybar style (CSS)
  when: selected_bar == "waybar"
  ansible.builtin.template:
    src: waybar.css.j2
    dest: "{{ ansible_env.HOME }}/.config/waybar/style.css"
    mode: '0644'

# Polybar Templates
- name: Deploy Polybar config (INI)
  when: selected_bar == "polybar"
  ansible.builtin.template:
    src: polybar.ini.j2
    dest: "{{ ansible_env.HOME }}/.config/polybar/config.ini"
    mode: '0644'
