---
# =============================================================================
# WALLPAPER DIRECTORY SETUP
# =============================================================================
- name: Ensure Wallpapers directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Pictures/Wallpapers"
    state: directory
    mode: '0755'

- name: Download default wallpaper asset directly
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/dharmx/walls/main/anime/japan_street.png"
    dest: "{{ ansible_env.HOME }}/Pictures/Wallpapers/default.jpg"
    mode: '0644'

# =============================================================================
# PREREQUISITES & COMMON DIRECTORIES
# =============================================================================
- name: Ensure archive extraction utilities are installed
  become: true
  community.general.pacman:
    name:
      - unzip
      - tar
      - wget
    state: present

- name: Ensure local icon directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.icons"
    state: directory
    mode: '0755'

# =============================================================================
# INSTALL WALLPAPER DAEMONS
# =============================================================================
- name: Install Hyprpaper
  when: selected_wallpaper_daemon == "hyprpaper"
  become: true
  community.general.pacman:
    name: hyprpaper
    state: present

- name: Install Swaybg
  when: selected_wallpaper_daemon == "swaybg"
  become: true
  community.general.pacman:
    name: swaybg
    state: present

- name: Install Feh (X11)
  when: selected_wallpaper_daemon == "feh"
  become: true
  community.general.pacman:
    name: feh
    state: present

- name: Install SWWW via AUR
  when: selected_wallpaper_daemon == "swww"
  become: false
  ansible.builtin.command:
    cmd: yay -S --noconfirm --needed swww-bin
  changed_when: false

# =============================================================================
# DEPLOY WALLPAPER DAEMON CONFIGURATIONS
# =============================================================================
- name: Ensure hyprpaper directory exists
  when: selected_wallpaper_daemon == "hyprpaper"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/hypr"
    state: directory
    mode: '0755'

- name: Deploy hyprpaper config template
  when: selected_wallpaper_daemon == "hyprpaper"
  ansible.builtin.template:
    src: hyprpaper.conf.j2
    dest: "{{ ansible_env.HOME }}/.config/hypr/hyprpaper.conf"
    mode: '0644'

# =============================================================================
# INSTALL CURSOR THEMES VIA DIRECT ARCHIVE EXTRACTION
# =============================================================================
# Bibata Variants
- name: Download and extract Bibata Modern Classic Cursor Theme directly
  when: selected_cursor == 'bibata-classic'
  ansible.builtin.unarchive:
    src: "https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Classic.tar.xz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/Bibata-Modern-Classic"
    mode: '0755'

- name: Download and extract Bibata Modern Ice Cursor Theme directly
  when: selected_cursor == 'bibata-ice'
  ansible.builtin.unarchive:
    src: "https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice.tar.xz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/Bibata-Modern-Ice"
    mode: '0755'

- name: Download and extract Bibata Modern Amber Cursor Theme directly
  when: selected_cursor == 'bibata-amber'
  ansible.builtin.unarchive:
    src: "https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Amber.tar.xz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/Bibata-Modern-Amber"
    mode: '0755'

# BreezeX
- name: Download and extract BreezeX Cursor Theme directly
  when: selected_cursor == 'breezex'
  ansible.builtin.unarchive:
    src: "https://github.com/ful1e5/BreezeX_Cursor/releases/download/v2.0.1/BreezeX.tar.xz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/BreezeX-Light"
    mode: '0755'

# macOS Monterey (Apple)
- name: Download and extract macOS Monterey Cursor Theme directly
  when: selected_cursor == 'apple'
  ansible.builtin.unarchive:
    src: "https://github.com/ful1e5/apple_cursor/archive/refs/tags/v2.0.1.tar.gz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/macOS-Monterey"
    mode: '0755'

# Vimix
- name: Download and extract Vimix Cursor Theme directly
  when: selected_cursor == 'vimix'
  ansible.builtin.unarchive:
    src: "https://github.com/vinceliuice/Vimix-cursors/archive/refs/heads/master.zip"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/Vimix-cursors-master"
    mode: '0755'

- name: Ensure Vimix Cursor Theme directory is named correctly
  when: selected_cursor == 'vimix'
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.icons/Vimix-cursors-master/dist"
    dest: "{{ ansible_env.HOME }}/.icons/Vimix-cursors"
    state: link

# Catppuccin Variants
- name: Download and extract Catppuccin Latte Cursors
  when: selected_cursor == 'catppuccin-latte'
  ansible.builtin.unarchive:
    src: "https://github.com/catppuccin/cursors/releases/download/v0.3.1/catppuccin-latte-dark-cursors.tar.gz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/catppuccin-latte-dark-cursors"
    mode: '0755'

- name: Download and extract Catppuccin Frappe Cursors
  when: selected_cursor == 'catppuccin-frappe'
  ansible.builtin.unarchive:
    src: "https://github.com/catppuccin/cursors/releases/download/v0.3.1/catppuccin-frappe-dark-cursors.tar.gz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/catppuccin-frappe-dark-cursors"
    mode: '0755'

- name: Download and extract Catppuccin Macchiato Cursors
  when: selected_cursor == 'catppuccin-macchiato'
  ansible.builtin.unarchive:
    src: "https://github.com/catppuccin/cursors/releases/download/v0.3.1/catppuccin-macchiato-dark-cursors.tar.gz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/catppuccin-macchiato-dark-cursors"
    mode: '0755'

- name: Download and extract Catppuccin Mocha Cursors
  when: selected_cursor == 'catppuccin-mocha'
  ansible.builtin.unarchive:
    src: "https://github.com/catppuccin/cursors/releases/download/v0.3.1/catppuccin-mocha-dark-cursors.tar.gz"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/catppuccin-mocha-dark-cursors"
    mode: '0755'

# Phinger Variants
- name: Download and extract Phinger Cursors
  when: selected_cursor in ['phinger-light', 'phinger-dark']
  ansible.builtin.unarchive:
    src: "https://github.com/phisch/phinger-cursors/releases/latest/download/phinger-cursors-variants.tar.bz2"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/phinger-cursors-light"
    mode: '0755'

# =============================================================================
# MAP CURSOR SELECTION TO INTERNAL THEME NAMES
# =============================================================================
- name: Set cursor theme name fact
  ansible.builtin.set_fact:
    cursor_name: >-
      {% if selected_cursor == 'bibata-classic' %}Bibata-Modern-Classic
      {% elif selected_cursor == 'bibata-ice' %}Bibata-Modern-Ice
      {% elif selected_cursor == 'bibata-amber' %}Bibata-Modern-Amber
      {% elif selected_cursor == 'breezex' %}BreezeX-Light
      {% elif selected_cursor == 'apple' %}macOS-Monterey
      {% elif selected_cursor == 'vimix' %}Vimix-cursors
      {% elif selected_cursor == 'catppuccin-latte' %}catppuccin-latte-dark-cursors
      {% elif selected_cursor == 'catppuccin-frappe' %}catppuccin-frappe-dark-cursors
      {% elif selected_cursor == 'catppuccin-macchiato' %}catppuccin-macchiato-dark-cursors
      {% elif selected_cursor == 'catppuccin-mocha' %}catppuccin-mocha-dark-cursors
      {% elif selected_cursor == 'phinger-light' %}phinger-cursors-light
      {% elif selected_cursor == 'phinger-dark' %}phinger-cursors-dark
      {% else %}Bibata-Modern-Ice{% endif %}

# =============================================================================
# DEPLOY GTK & X11 CURSOR FALLBACK CONFIGURATIONS
# =============================================================================
- name: Ensure icon and GTK config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_env.HOME }}/.icons/default"
    - "{{ ansible_env.HOME }}/.config/gtk-3.0"
    - "{{ ansible_env.HOME }}/.config/gtk-4.0"

- name: Deploy X11 / XWayland default cursor fallback
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.icons/default/index.theme"
    content: |
      [Icon Theme]
      Name=Default
      Comment=Default Cursor Theme
      Inherits={{ cursor_name | trim }}
    mode: '0644'

- name: Configure GTK 3.0 cursor settings
  ansible.builtin.ini_file:
    path: "{{ ansible_env.HOME }}/.config/gtk-3.0/settings.ini"
    section: Settings
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: '0644'
  loop:
    - { option: 'gtk-cursor-theme-name', value: "{{ cursor_name | trim }}" }
    - { option: 'gtk-cursor-theme-size', value: '24' }

- name: Configure GTK 4.0 cursor settings
  ansible.builtin.ini_file:
    path: "{{ ansible_env.HOME }}/.config/gtk-4.0/settings.ini"
    section: Settings
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: '0644'
  loop:
    - { option: 'gtk-cursor-theme-name', value: "{{ cursor_name | trim }}" }
    - { option: 'gtk-cursor-theme-size', value: '24' }

# =============================================================================
# INSTALL ICON THEMES DIRECTLY
# =============================================================================
# Papirus Icon Theme
- name: Download and install Papirus Icon Theme via official install script
  when: selected_icon_theme == 'papirus'
  ansible.builtin.shell:
    cmd: "wget -qO- https://git.io/papirus-icon-theme-install | DESTDIR={{ ansible_env.HOME }}/.icons sh"
    creates: "{{ ansible_env.HOME }}/.icons/Papirus-Dark"

# Candy Icons
- name: Download and extract Candy Icon Theme directly
  when: selected_icon_theme == 'candy'
  ansible.builtin.unarchive:
    src: "https://github.com/EliverLara/candy-icons/archive/refs/heads/master.zip"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/candy-icons-master"
    mode: '0755'

- name: Ensure Candy Icon Theme directory is named correctly
  when: selected_icon_theme == 'candy'
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.icons/candy-icons-master"
    dest: "{{ ansible_env.HOME }}/.icons/Candy-icons"
    state: link

# La Capitaine Icons
- name: Clone La Capitaine Icon Theme repository
  when: selected_icon_theme == 'la-capitaine'
  ansible.builtin.git:
    repo: 'https://github.com/keeferrourke/la-capitaine-icon-theme.git'
    dest: "{{ ansible_env.HOME }}/.icons/la-capitaine-icon-theme"
    depth: 1
    update: false

# Flat Remix Icons
- name: Download and extract Flat Remix Icon Theme directly
  when: selected_icon_theme == 'flat-remix'
  ansible.builtin.unarchive:
    src: "https://github.com/daniruiz/flat-remix/archive/master.zip"
    dest: "{{ ansible_env.HOME }}/.icons/"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.icons/flat-remix-master"
    mode: '0755'

- name: Ensure Flat Remix Icon Theme directory is named correctly
  when: selected_icon_theme == 'flat-remix'
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.icons/flat-remix-master/Flat Remix Dark"
    dest: "{{ ansible_env.HOME }}/.icons/Flat-Remix-Dark"
    state: link

# =============================================================================
# MAP ICON SELECTION TO INTERNAL THEME NAMES
# =============================================================================
- name: Set icon theme name fact
  ansible.builtin.set_fact:
    icon_theme_name: >-
      {% if selected_icon_theme == 'papirus' %}Papirus-Dark
      {% elif selected_icon_theme == 'candy' %}Candy-icons
      {% elif selected_icon_theme == 'la-capitaine' %}la-capitaine-icon-theme
      {% elif selected_icon_theme == 'flat-remix' %}Flat-Remix-Dark
      {% else %}Papirus-Dark{% endif %}

# =============================================================================
# APPLY ICON THEME TO GTK 3.0 & GTK 4.0
# =============================================================================
- name: Configure GTK 3.0 icon settings
  ansible.builtin.ini_file:
    path: "{{ ansible_env.HOME }}/.config/gtk-3.0/settings.ini"
    section: Settings
    option: gtk-icon-theme-name
    value: "{{ icon_theme_name | trim }}"
    mode: '0644'

- name: Configure GTK 4.0 icon settings
  ansible.builtin.ini_file:
    path: "{{ ansible_env.HOME }}/.config/gtk-4.0/settings.ini"
    section: Settings
    option: gtk-icon-theme-name
    value: "{{ icon_theme_name | trim }}"
    mode: '0644'
